name: V1027 Govee Concert Sync 3.0 validation
run-name: Sonic Display · V1028 · V1027 Govee Concert Sync 3.0 validation
# Optional diagnostics. Full Linux/Windows production workflow is the source of truth.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/v959-source-preflight.cjs
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run test:v1027 && npm run test:v1027:types
      - run: npm run test:v1026 && npm run test:v1025 && npm run test:v1024
      - run: npm run check:syntax && npm run check:architecture
      - run: npm run typecheck && npm run build:next
