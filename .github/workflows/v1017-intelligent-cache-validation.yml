name: V1017 Intelligent Cache Manager
run-name: Sonic Display · V1039 · V1017 Intelligent Cache Manager
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/v1017-release-readiness.cjs
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run test:v1017
      - run: npm run test:v1017:types
      - run: npm run test:v1016
      - run: npm run test:v1015
      - run: npm run typecheck
      - run: npm run build:next
