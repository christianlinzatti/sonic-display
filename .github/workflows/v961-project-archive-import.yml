name: V961 Import Complete Project ZIP
run-name: Sonic Display · V1105 · V961 Import Complete Project ZIP
# Historical checks remain available on demand; automatic production CI is centralized.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: v961-project-import-master
  cancel-in-progress: false
jobs:
  import-v961:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out uploaded source ZIP
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate archive safety and import V961 source files
        run: python3 scripts/v961-project-archive-import.py
      - name: Reject stale or syntactically broken V961 archive before committing
        run: |
          node --check scripts/v961-production-verify.cjs
          node --check scripts/release-integrity-v752.cjs
          node tests/v752-build-integrity-regression.cjs
          node tests/v8659-prebuild-gate-compat-regression.cjs
      - name: Preserve organized changelogs and repair version-doc test references
        run: node scripts/organize-version-docs.cjs
      - name: Commit verified sources to master, preserving protected workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: import full Sonic Display V961 project'
            git push origin HEAD:master
          fi
      - name: Run V961 Windows/Linux production gate on imported revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run v961-concert-light-governor.yml --ref master
