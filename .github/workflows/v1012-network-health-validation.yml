name: V1012 Network Health & Auto Recovery
run-name: Sonic Display · V1041 · V1012 Network Health & Auto Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run test:v1012
      - run: npm run test:v1012:types
      - run: npm run test:v1011
      - run: npm run test:v1010
      - run: npm run test:v1003
      - run: npm run typecheck
      - run: npm run build:next
