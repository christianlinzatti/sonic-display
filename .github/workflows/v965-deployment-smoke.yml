name: Sonic Display · Deployment reachability
run-name: Sonic Display · V1043 · Deployment reachability · ${{ github.event.deployment_status.state || github.event_name }}
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Public Sonic Display deployment URL (*.vercel.app)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  deployed-site-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment_url, 'sonic-display') &&
       contains(github.event.deployment_status.environment_url, '.vercel.app'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERCEL_DEPLOYMENT_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_url || github.event.deployment_status.environment_url }}
      # Optional GitHub Actions secret from Vercel Project > Deployment Protection.
      # Never echo this value or add it to the target URL.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Explain deployment check scope
        run: |
          echo '### Deployment reachability only' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job checks deployed HTML. Full regression, TypeScript, build and browser tests run in [Production & Playwright](https://github.com/christianlinzatti/sonic-display/actions/workflows/v965-room-wave-production.yml).' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test public deployed HTML without touching authentication or Govee
        run: node scripts/check-vercel-deployment-v965.cjs
      - name: Save measured result, even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v965-vercel-public-reachability
          path: reports/v965-deployment-smoke.json
          if-no-files-found: warn
          retention-days: 14
