name: V1043 Intelligent Show Camera Director manual validation
run-name: Sonic Display · V1043 · V1043 Intelligent Show Camera Director manual validation
# Optional manual integration check. v965 is the authoritative automatic production matrix.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run test:v1043 && npm run test:v1043:types
      - run: npm run test:v1042 && npm run test:v1042:types
      - run: npm run test:v1041 && npm run test:v1041:types
      - run: node scripts/v959-source-preflight.cjs
      - run: npm run typecheck
      - run: npm run build:next
