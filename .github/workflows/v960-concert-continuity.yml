name: V960 Concert Continuity Production Gate
run-name: Sonic Display · V1022 · V960 Concert Continuity Production Gate
# Historical checks remain available on demand; automatic production CI is centralized.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: v960-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-production-gate:
    name: V960 full tests + TypeScript + Next.js / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      SONIC_TEST_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: V960 source preflight (before install)
        run: node scripts/v959-source-preflight.cjs
      - name: Install exactly as lockfile
        run: npm ci --no-audit --no-fund
      - name: V960 verification incl. parallel regressions, TypeScript, Next.js production build
        run: node scripts/v960-production-verify.cjs
      - name: Always publish truthful V960 + V959 evidence
        if: always()
        run: node scripts/v959-ci-finalize.cjs
      - name: Upload release evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v960-${{ matrix.os }}-production-proof
          path: |
            reports/v960-production-proof.json
            reports/v959-build-proof.json
            reports/v959-build-summary.md
            reports/v931-production-gate.json
            reports/v959-regression-logs/*.log
          if-no-files-found: warn
