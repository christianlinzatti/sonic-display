name: Sonic Display release quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    name: Quality checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install project dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }
      - name: Full verification (regression suite, typecheck and production build)
        run: npm run verify
