name: Sonic Display historical regression suite
run-name: Sonic Display · V1043 · historical regression suite
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
permissions:
  contents: read
jobs:
  historical:
    name: Extended historical regressions (Node 22 / Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate release lockfile and CI gates
        run: npm run check:lockfile:v752
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Extended historical checks (not duplicated on every push)
        run: npm run verify:historical
