name: Sonic Display V571 production build verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  production:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (warn if reproducible lockfile is missing)
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            Write-Warning 'package-lock.json is missing! CI bootstrap is not reproducible until the generated lockfile is committed.'
            npm install --no-audit --no-fund
          }
      - name: V571 fast regression suite
        run: npm run test:smoke:v571
      - name: Full application typecheck
        run: npm run typecheck
      - name: Real Next.js production build
        run: npm run build
      - name: Report local dependency and lock state
        if: always()
        run: npm run audit:v571:environment
# Browser/CDP + real GLBs and Raspberry Pi measurements are separate manual stages.
