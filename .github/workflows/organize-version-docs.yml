name: Organize Version Documentation
run-name: Sonic Display · V1017 · Organize Version Documentation
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/organize-version-docs.yml'
      - 'scripts/organize-version-docs.cjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: version-docs-migration-master
  cancel-in-progress: false
jobs:
  migrate-version-docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Organize docs and repair references and tests
        run: node scripts/organize-version-docs.cjs
      - name: Verify layout and commit renames as one change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'All version docs already organized'
          else
            git diff --cached --stat | tail -12
            git commit -m 'docs: move historical version documentation to docs/versions'
            git push origin HEAD:master
          fi
      - name: Start fresh Windows and Linux production tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run v961-concert-light-governor.yml --ref master
