name: V1004 Production Reliability - Node 24 Linux & Windows
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tests/v1004-production-reliability-regression.cjs'
      - 'scripts/vercel-production-build.cjs'
permissions:
  contents: read
jobs:
  production:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/release-integrity-v752.cjs --ci
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run verify:v1004:focused
      - run: npm run typecheck
      - run: npm run build:next
