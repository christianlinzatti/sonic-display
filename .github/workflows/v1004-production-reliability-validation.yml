name: V1004 Production Reliability - Node 24 Linux & Windows
run-name: Sonic Display · V1017 · V1004 Production Reliability - Node 24 Linux & Windows
# Historical checks remain available on demand; automatic production CI is centralized.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  production:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/release-integrity-v752.cjs --ci
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run verify:v1004:focused
      - run: npm run typecheck
      - run: npm run build:next
