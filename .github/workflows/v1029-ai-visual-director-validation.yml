name: V1029 AI Visual Director 5.0 validation
run-name: Sonic Display · V1039 · V1029 AI Visual Director 5.0 validation
# Optional diagnostic; the full Linux/Windows production matrix remains authoritative.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/v959-source-preflight.cjs
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run test:v1029 && npm run test:v1029:types
      - run: npm run test:v1028 && npm run test:v1027 && npm run test:v1026
      - run: npm run check:syntax && npm run check:architecture
      - run: npm run typecheck && npm run build:next
