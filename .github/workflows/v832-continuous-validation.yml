            v867-release-dashboard.json
            v867-release-dashboard.html
          if-no-files-found: warn
# Browser/WebGL/GPU and real GLB concert-playthroughs require separate observed acceptance.

  release-matrix-dashboard:
    name: V867 Windows + Linux release overview
    if: always()
    needs: [full-technical-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download per-OS technical reports
        uses: actions/download-artifact@v7
        with:
          pattern: v832-*-technical-report
          path: v867-artifacts
          merge-multiple: false
      - name: Build fail-closed cross-platform release dashboard
        if: always()
        run: node scripts/v867-release-dashboard.cjs --aggregate --input v867-artifacts
      - name: Upload Windows/Linux overview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v867-windows-linux-release-dashboard
          path: |
            v867-release-matrix.json
            v867-release-matrix.html
          if-no-files-found: error
# Matrices and dashboards report technical status only, never a production release.
