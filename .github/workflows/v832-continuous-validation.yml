name: V832 Continuous Technical Validation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-technical-gate:
    name: Full tests TypeScript and Next / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: V929 Smart Govee Troubleshooting Assistant (regression and isolated type checks)
        run: npm run test:v929 && npm run test:v929:types && npm run test:v929:ui-types
      - name: V928 regression and available isolated type checks
        run: npm run test:v928 && npm run test:v928:types && npm run test:v928:ui-types
      - name: V927 regression and available isolated type checks
        run: npm run test:v927 && npm run test:v927:types && npm run test:v927:ui-types
      - name: V926 regression and available isolated type checks
        run: npm run test:v926 && npm run test:v926:types && npm run test:v926:ui-types
      - name: V925 Govee Festival Lighting FX Studio (regression and isolated type checks)
        run: npm run test:v925 && npm run test:v925:types && npm run test:v925:ui-types
      - name: V924 Govee Intelligent Light Energy Director (regression and isolated type checks)
        run: npm run test:v924 && npm run test:v924:types && npm run test:v924:ui-types
      - name: V923 Govee Neon Pulse Experience (regression and isolated type checks)
        run: npm run test:v923 && npm run test:v923:types && npm run test:v923:ui-types
      - name: V922 regression and available isolated type checks
        run: npm run test:v922 && npm run test:v922:types && npm run test:v922:ui-types
      - name: V921 regression and available isolated type checks
        run: npm run test:v921 && npm run test:v921:types && npm run test:v921:ui-types
      - name: V920 Govee Genre Adaptive Light Intelligence (regression and isolated type checks)
        run: npm run test:v920 && npm run test:v920:types && npm run test:v920:ui-types
      - name: V919 Govee Verse Hook Drop Director (regression and isolated type checks)
        run: npm run test:v919 && npm run test:v919:types && npm run test:v919:ui-types
      - name: V918 regression and available isolated type checks
        run: npm run test:v918 && npm run test:v918:types && npm run test:v918:ui-types
      - name: V917 regression and available isolated type checks
        run: npm run test:v917 && npm run test:v917:types && npm run test:v917:ui-types
      - name: V916 Govee Smart Light Preset Library (regression and isolated type checks)
        run: npm run test:v916 && npm run test:v916:types && npm run test:v916:ui-types
      - name: V915 regression and available isolated type checks
        run: npm run test:v915 && npm run test:v915:types
      - name: V914 regression and available isolated type checks
        run: npm run test:v914 && npm run test:v914:types
      - name: V913 regression and available isolated type checks
        run: npm run test:v913 && npm run test:v913:types
      - name: V912 regression and available isolated type checks
        run: npm run test:v912 && npm run test:v912:types
      - name: V911 regression and available isolated type checks
        run: npm run test:v911 && npm run test:v911:types
      - name: V910 regression and available isolated type checks
        run: npm run test:v910
      - name: V909 regression and available isolated type checks
        run: npm run test:v909 && npm run test:v909:types
      - name: V908 regression and available isolated type checks
        run: npm run test:v908 && npm run test:v908:types && npm run test:v908:ui-types
      - name: V873 Cinematic Lyrics 10.0 and TypeScript core
        run: npm run test:v873 && npm run test:v873:types
      - name: V872 natural dance continuity and TypeScript core
        run: npm run test:v872 && npm run test:v872:types
      - name: V871 Festival FX coordination and TypeScript core
        run: npm run test:v871 && npm run test:v871:types
      - name: V870 LED motif safety and TypeScript core
        run: npm run test:v870 && npm run test:v870:types
      - name: V869 Deutschrap vocal safety and TypeScript core
        run: npm run test:v869 && npm run test:v869:types
      - name: Portable Windows line-ending regression
        run: npm run test:v86513:windows-eol
      - name: Flat npm-chain regression
        run: npm run test:v86512:flat
      - name: Windows V665 smoke (flattened, complete)
        if: runner.os == 'Windows'
        run: npm run test:smoke:v665:flat
      - name: Full regressions, TypeScript, real production build
        run: npm run verify:production:v867
      - name: Create offline dashboard even when the gate was skipped
        if: always()
        run: node scripts/v867-release-dashboard.cjs --from-report --platform ${{ matrix.os }}
      - name: Upload technical gate output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v832-${{ matrix.os }}-technical-report
          path: |
            v831-production-gate-result.json
            v831-build-readiness-result.json
            v867-release-dashboard.json
            v867-release-dashboard.html
          if-no-files-found: warn
# Browser/WebGL/GPU and real GLB concert-playthroughs require separate observed acceptance.

  release-matrix-dashboard:
    name: V867 Windows + Linux release overview
    if: always()
    needs: [full-technical-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Download per-OS technical reports
        uses: actions/download-artifact@v4
        with:
          pattern: v832-*-technical-report
          path: v867-artifacts
          merge-multiple: false
      - name: Build fail-closed cross-platform release dashboard
        if: always()
        run: node scripts/v867-release-dashboard.cjs --aggregate --input v867-artifacts
      - name: Upload Windows/Linux overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v867-windows-linux-release-dashboard
          path: |
            v867-release-matrix.json
            v867-release-matrix.html
          if-no-files-found: error
# Matrices and dashboards report technical status only, never a production release.
