name: V959 Parallel Regression and Production Build
run-name: Sonic Display · V1041 · V959 Parallel Regression and Production Build
# Historical checks remain available on demand; automatic production CI is centralized.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  parallel-build-gate:
    name: Parallel tests TypeScript and Next / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SONIC_TEST_CONCURRENCY: '3'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Parallel regression tests (bounded to 3)
        run: node scripts/v959-regressions-only.cjs
      - name: Full app TypeScript check
        run: npm run typecheck
      - name: Real Next.js production build
        run: node node_modules/next/dist/bin/next build
      - name: Upload per-platform evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v959-ci-${{ matrix.os }}-reports
          path: |
            reports/v959-regression-only.json
            reports/v959-regression-logs/
          if-no-files-found: warn
# This workflow checks the committed repository; it does not itself deploy V959.
