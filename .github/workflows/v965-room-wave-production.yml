# Keep the filename stable: older ZIP importers already dispatch this entry point.
name: Sonic Display · Production & Playwright
run-name: Sonic Display · ${{ inputs.release || 'V1128' }} · Production & Playwright · ${{ github.event_name }}
on:
  push:
    branches: [master]
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - 'changelog/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - 'changelog/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Optional expected release, e.g. V1005 (checked against package.json)'
        required: false
        type: string
      revision:
        description: 'Optional exact imported commit SHA (40 characters)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sonic-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release:
    name: Resolve release and exact source revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read version from checked-out package and verify import metadata
        id: metadata
        env:
          EXPECTED_RELEASE: ${{ inputs.release }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: node scripts/production-workflow-metadata.cjs
  v965-production:
    needs: release
    name: ${{ needs.release.outputs.release }} · ${{ matrix.os == 'windows-latest' && 'Windows smoke (TypeScript + build)' || 'Full production + Playwright' }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      SONIC_TEST_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify lockfile and cross-platform source names
        run: node scripts/v959-source-preflight.cjs
      - name: Install reproducible dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify workflow routing and release metadata
        run: node tests/production-workflow-regression.cjs
      - name: Pi scripts and standalone bridge on native Bash
        run: node tests/v971-integration-setup-regression.cjs
      - name: Release reliability regressions
        run: npm run verify:v1004:focused
      # Full historical regression coverage is already enforced by the inherited
      # Linux production gate. Avoid duplicating dozens of costly suites.
      - name: Active imported release (regression and isolated type checks)
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version.match(/-v([0-9]+)$/)?.[1] || ''")
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then echo 'Invalid release version'; exit 1; fi
          npm run "test:v${version}"
          npm run "test:v${version}:types"
      - name: Ubuntu · full regressions, TypeScript, Next.js build, Playwright and soak
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/v965-production-verify.cjs
      - name: Windows · full TypeScript without duplicated regression chain
        if: matrix.os == 'windows-latest'
        run: node node_modules/typescript/bin/tsc --noEmit --pretty false
      - name: Windows · record clean build start for artifact freshness proof
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "SONIC_WINDOWS_BUILD_STARTED_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Windows · Next.js production build without npm prebuild rerun
        if: matrix.os == 'windows-latest'
        env:
          NODE_ENV: production
          SONIC_LOW_MEMORY_BUILD: '1'
        run: node node_modules/next/dist/bin/next build
      - name: Verify emitted production artifacts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node scripts/check-next-build-v964.cjs "$SONIC_WINDOWS_BUILD_STARTED_MS"
          else
            node scripts/check-next-build-v964.cjs
          fi
      - name: Publish every recorded test result in the job summary
        if: ${{ always() && matrix.os == 'ubuntu-24.04' }}
        env:
          SONIC_TEST_REVISION: ${{ needs.release.outputs.revision }}
        run: node .github/scripts/production-test-summary.cjs
      - name: Explain Windows smoke scope in summary
        if: ${{ always() && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          echo '### Windows TypeScript + Next.js production smoke' >> "$GITHUB_STEP_SUMMARY"
          echo 'The complete historical regressions, Playwright desktop/touch screenshots and resource soak run on Ubuntu and remain mandatory.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save production and browser evidence, including failures
        if: ${{ always() && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@v6
        with:
          name: sonic-${{ needs.release.outputs.release }}-${{ matrix.os }}-production
          path: |
            reports/*production-proof.json
            reports/v931-production-gate.json
            reports/v959-regression-logs/*.log
            reports/playwright-production/
            reports/playwright-soak/
          if-no-files-found: warn
          retention-days: 30
