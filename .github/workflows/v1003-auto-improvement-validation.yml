name: V1003 AI Auto Improvement Director production validation
run-name: Sonic Display · V1028 · V1003 AI Auto Improvement Director production validation
# Historical checks remain available on demand; automatic production CI is centralized.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: node tests/v1003-auto-improvement-regression.cjs
      - run: npm run test:v1003:types
      - run: npm run check:syntax
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm run build:next
