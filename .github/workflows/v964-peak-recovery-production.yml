name: V964 Peak Recovery and Vercel Production Gate
run-name: Sonic Display · V1023 · V964 Peak Recovery and Vercel Production Gate
# Historical checks remain available on demand; automatic production CI is centralized.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sonic-v964-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v964-production:
    name: Full V964 source, regressions, TypeScript and Next.js / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      SONIC_TEST_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check source and lockfile before install
        run: node scripts/v959-source-preflight.cjs
      - name: Reproducible dependency install
        run: npm ci --include=dev --no-audit --no-fund
      - name: Full inherited V931/V963 gate and real V964 production build
        run: node scripts/v964-production-verify.cjs
      - name: Check generated Next.js artifacts from this build
        run: node scripts/check-next-build-v964.cjs
      - name: Upload release evidence, including failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sonic-v964-${{ matrix.os }}-production
          path: |
            reports/v964-production-proof.json
            reports/v963-production-proof.json
            reports/v931-production-gate.json
            reports/v959-regression-logs/*.log
          if-no-files-found: warn
          retention-days: 30
