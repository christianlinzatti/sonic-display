name: V1010 Central Network Coordination
run-name: Sonic Display · V1039 · V1010 Central Network Coordination
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run test:v1010
      - run: npm run test:v1010:types
      - run: npm run check:syntax
      - run: npm run typecheck
      - run: npm run build:next
