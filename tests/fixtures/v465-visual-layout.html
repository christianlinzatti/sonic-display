<!doctype html>

<link rel="stylesheet" href="../../app/globals.css"/>
<style>
/* Fixture only: stage geometry / face placeholders for reproducible layout measurements.
 * This file is NOT a rendered Sonic Display concert or GLB quality measurement. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:white}
.immersive-stage.v465-qa-stage{display:block;position:relative;inset:0;width:100%;height:100vh;min-height:0;overflow:hidden;background:linear-gradient(#172034,#070915)}
.v465-qa-stage>.visualizer-stage{position:absolute;inset:0;width:100%;height:100%;max-width:none;transform:none;background:radial-gradient(ellipse at 46% 52%,#192d49,#05070b 82%)}
.qa-avatar{position:absolute;top:18%;width:13%;height:48%;border-radius:46% 46% 24% 24%;background:linear-gradient(#647da9,#314469);border:2px solid #839cc0aa;box-sizing:border-box;display:flex;justify-content:center;padding-top:6%;font:small system-ui}
.qa-avatar span{position:absolute;top:12%;height:21%;width:35%;border-radius:45%;background:#b1c4eb75}
.qa-title{position:absolute;top:5px;left:7px;z-index:15;font:12px system-ui;color:#aaa;max-width:80%}
.v465-qa-stage .lyrics{display:flex;flex-direction:column;justify-content:center;align-items:center;color:white}
.v465-qa-stage .lyrics-window{display:flex;flex-direction:column;gap:12px;max-width:100%;width:100%}
.v465-qa-stage .lyric{text-align:center;white-space:normal;color:#dde8ff}
.v465-qa-stage .lyric.active{color:white;font-weight:760;text-shadow:0 2px 10px #000;font-size:clamp(1rem,2.4vw,2.6rem)}
.v465-qa-stage .lyric:not(.active){opacity:.5}
</style>
</head>
<body>
<section class="immersive-stage immersive-active immersive-side-right v378-lyrics-stage v465-qa-stage" data-v465-visual-mode="lyrics-first" aria-label="V465 fixture layout">
 <div class="visualizer-stage" aria-label="Fixture only – four static avatar silhouettes">
   <div class="qa-avatar" style="left:4%"><span></span></div><div class="qa-avatar" style="left:21%"><span></span></div>

 </div>
 <span class="qa-title">V465 BROWSER-LAYOUT-FIXTURE – SILHOUETTEN, KEINE ECHTEN GLB-MODELLE</span>
